# Kiotel portal frontend (Next.js) — self-contained.
#
# Run from THIS directory; it has no dependency on where the backend or the
# Flask service live, so the projects can sit anywhere on the prod box:
#
#   docker compose build
#   docker compose up -d
#
# Nothing here talks to the other services over a Docker network, and that is
# not an oversight. Every backend/Flask call this app makes runs in the user's
# BROWSER -- there are no Next.js route handlers and no server components that
# fetch the API. So the URLs below must be reachable from the browser, and this
# container needs no link to anything.

services:
  portal-client:
    build:
      context: .
      args:
        # BUILD-TIME values. Next.js inlines NEXT_PUBLIC_* into the JavaScript
        # bundle during `next build`; it does not read them at run time. There
        # are ~398 references to NEXT_PUBLIC_BACKEND_URL across src/.
        #
        # Consequences worth internalising:
        #   * Changing any of these needs `docker compose build`, NOT a restart.
        #   * Putting them under `environment:` below would do nothing at all.
        #   * The image is therefore bound to one environment. Promoting from
        #     staging to prod means a rebuild, not a re-tag.
        #
        # Values come from .env in this directory.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5555}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_EXTERNAL_API_TOKEN: ${NEXT_PUBLIC_EXTERNAL_API_TOKEN:-}
        NEXT_PUBLIC_URL_ext: ${NEXT_PUBLIC_URL_ext:-https://kioteldashboard.kiotel.co/}

    image: kiotel-portal-client:latest
    container_name: kiotel-portal-client
    restart: unless-stopped

    # Runs tini as PID 1 in front of Node. The kernel applies no default signal
    # action to PID 1, so any signal Node does not explicitly handle is ignored
    # and the stop falls through to SIGKILL after 10s. tini forwards signals and
    # reaps zombie child processes.
    init: true

    # json-file logs are unbounded by default; cap at ~50 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    environment:
      TZ: Asia/Kolkata

    ports:
      - "${CLIENT_PORT:-3000}:3000"
